name: Homepage checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - name: Upload browser traces and visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
